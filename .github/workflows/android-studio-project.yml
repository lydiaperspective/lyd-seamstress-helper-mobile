name: Build native Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-studio-project.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Kotlin + Compose debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate Gradle 8.13 wrapper in an isolated directory
        run: |
          mkdir -p /tmp/wrapper-bootstrap
          printf "tasks.register('noop')\\n" > /tmp/wrapper-bootstrap/build.gradle
          gradle -p /tmp/wrapper-bootstrap wrapper --gradle-version 8.13
          mkdir -p gradle/wrapper
          cp /tmp/wrapper-bootstrap/gradlew .
          cp /tmp/wrapper-bootstrap/gradlew.bat .
          cp /tmp/wrapper-bootstrap/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          cp /tmp/wrapper-bootstrap/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
      - name: Build debug APK with pinned Gradle wrapper
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seamwork-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Commit Gradle wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          if git diff --cached --quiet; then
            echo "Gradle wrapper is already up to date."
          else
            git commit -m "Pin Gradle wrapper to 8.13"
            git push
          fi
